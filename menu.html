<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Saffron Table</title>
  <meta name="description" content="Explore the Saffron Table menu: starters, tandoor, biryani, mains, breads and desserts.">
  <meta name="theme-color" content="#17130f">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif'],display:['Playfair Display','Georgia','serif']},colors:{ink:'#17130f',cream:'#f8f4ed',gold:'#c9944a',muted:'#71695f'}}}};
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-cream text-ink">
<div id="site-header"></div>
<main>
  <section class="bg-ink px-5 pb-16 pt-32 text-white sm:px-8 lg:px-12">
    <div class="mx-auto max-w-7xl reveal"><p class="eyebrow !text-gold">Fresh from our kitchen</p><h1 class="font-display text-5xl sm:text-7xl">The <em>menu.</em></h1><p class="mt-5 max-w-xl leading-7 text-white/70">A focused selection of familiar favourites, prepared fresh and served generously.</p></div>
  </section>
  <section class="sticky top-[72px] z-30 border-b border-black/10 bg-cream/95 px-5 py-3 backdrop-blur sm:px-8">
    <div id="category-tabs" class="mx-auto flex max-w-7xl gap-2 overflow-x-auto pb-1"></div>
  </section>
  <section class="section-pad pt-12">
    <div id="menu-grid" class="mx-auto max-w-7xl space-y-16"></div>
  </section>
  <section class="bg-[#ede5d9] py-16 text-center">
    <p class="eyebrow">Ready to order?</p><h2 class="font-display text-4xl sm:text-5xl">Make it a <em>feast.</em></h2>
    <a data-whatsapp href="#" class="btn-primary mt-7 inline-flex">Order on WhatsApp</a>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/app.js"></script><script src="assets/js/menu.js"></script>
</body></html>
